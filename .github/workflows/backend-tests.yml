# Roda os testes do back-end a cada push e pull request.
# - Os testes de integração usam Testcontainers: os runners ubuntu do GitHub já vêm com Docker.
# - A avaliação da IA (@Tag("eval")) fica de fora por padrão no pom.xml, e este workflow não tem
#   ANTHROPIC_API_KEY. Ou seja, o CI nunca chama a API nem gasta créditos.
name: Backend tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Testes
        run: |
          chmod +x mvnw
          ./mvnw -B test

      - name: Relatórios dos testes (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
