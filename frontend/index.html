<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowBoard</title>
    <meta name="description" content="Gerenciador de tarefas com sugestões geradas por IA.">
    <meta name="color-scheme" content="dark">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <!-- Versão fixa: "@latest" pode mudar (e quebrar) sem aviso. -->
    <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>

    <header class="app-header">
        <div class="app-header-inner">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true"></span>
                <div>
                    <h1>FlowBoard</h1>
                    <p>Transforme tarefas em resultados.</p>
                </div>
            </div>

            <button id="open-modal-btn" class="primary-btn">
                <i data-lucide="plus" aria-hidden="true"></i>
                Nova tarefa
            </button>
        </div>
    </header>

    <main class="container">

        <section class="overview" aria-labelledby="overview-title">
            <div class="overview-text">
                <h2 id="overview-title">Seu progresso</h2>
                <p id="summary-message">
                    Organize suas tarefas, acompanhe seu progresso e mantenha o foco no que importa.
                </p>
            </div>

            <dl class="stats">
                <div class="stat">
                    <dt>Total</dt>
                    <dd id="total-tasks">0</dd>
                </div>
                <div class="stat">
                    <dt>Concluídas</dt>
                    <dd id="completed-tasks">0</dd>
                </div>
                <div class="stat">
                    <dt>Em andamento</dt>
                    <dd id="pending-tasks">0</dd>
                </div>
                <div class="stat stat-progress">
                    <dt>Produtividade</dt>
                    <dd id="productivity">0%</dd>
                    <div class="progress-bar" aria-hidden="true">
                        <div id="productivity-bar" class="progress-fill"></div>
                    </div>
                </div>
            </dl>
        </section>

        <section class="task-section" aria-labelledby="tasks-title">
            <div class="section-header">
                <h2 id="tasks-title">Suas atividades</h2>

                <div class="filters" role="group" aria-label="Filtrar tarefas">
                    <button class="filter-btn active">Todas</button>
                    <button class="filter-btn">Pendentes</button>
                    <button class="filter-btn">Concluídas</button>
                </div>
            </div>

            <div id="task-list" class="task-list" aria-live="polite">

            </div>
        </section>

    </main>

    <div id="task-modal" class="modal-overlay">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
            <h2 id="task-modal-title">Nova tarefa</h2>

            <form id="task-form">
                <!-- Criação por linguagem natural: preenche os campos abaixo para revisão, não salva. -->
                <div id="ai-fill" class="ai-fill">
                    <label for="ai-text">Descreva a tarefa com suas palavras</label>
                    <textarea id="ai-text" maxlength="500"
                        placeholder="Ex: estudar árvores AVL pra prova de estrutura de dados quinta, urgente"></textarea>
                    <button type="button" id="ai-fill-btn" class="secondary-btn">Preencher com IA</button>
                    <p id="ai-fill-status" class="ai-fill-status" aria-live="polite"></p>
                </div>

                <label for="title">Título</label>
                <input type="text" id="title" placeholder="Ex: Finalizar projeto XCL" required maxlength="255">

                <label for="description">Descrição</label>
                <textarea id="description" placeholder="Descreva sua tarefa" maxlength="255"></textarea>

                <div class="field-row">
                    <div class="field">
                        <label for="priority">Prioridade</label>
                        <select id="priority">
                            <option value="LOW">Baixa</option>
                            <option value="MEDIUM">Média</option>
                            <option value="HIGH">Alta</option>
                        </select>
                    </div>

                    <div class="field">
                        <label for="category">Categoria</label>
                        <select id="category">
                            <option value="WORK">Trabalho</option>
                            <option value="STUDY">Estudos</option>
                            <option value="PERSONAL">Pessoal</option>
                            <option value="HEALTH">Saúde</option>
                            <option value="HOME">Casa</option>
                            <option value="FINANCE">Finanças</option>
                        </select>
                    </div>
                </div>

                <label for="dueDate">Prazo (opcional)</label>
                <input type="date" id="dueDate">

                <div class="modal-actions">
                    <button type="button" id="close-modal-btn" class="secondary-btn">Cancelar</button>
                    <button type="submit" class="primary-btn">Salvar tarefa</button>
                </div>
            </form>
        </div>
    </div>

    <div id="delete-modal" class="modal-overlay">
        <div class="modal delete-modal" role="alertdialog" aria-modal="true" aria-labelledby="delete-modal-title">
            <h2 id="delete-modal-title">Excluir tarefa?</h2>
            <p>Essa ação não poderá ser desfeita.</p>

            <div class="modal-actions">
                <button type="button" id="cancel-delete-btn" class="secondary-btn">Cancelar</button>
                <button type="button" id="confirm-delete-btn" class="danger-btn">Excluir</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <script src="js/api.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/summary.js"></script>
    <script src="js/ui.js"></script>
    <script src="js/script.js"></script>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
