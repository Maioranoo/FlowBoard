spring.application.name=backend

# --- Banco de dados ---
# Senha NUNCA no código: em produção vem do Render; localmente, da variável DATABASE_PASSWORD.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/flowboard_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# O esquema é criado e alterado SÓ pelas migrações do Flyway (src/main/resources/db/migration).
# O Hibernate apenas confere, ao subir, se as tabelas batem com as entidades.
spring.jpa.hibernate.ddl-auto=validate
# Em um banco que já existia sem o Flyway (produção), registra a versão 1 como ponto de partida.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
# Imprimir cada SQL no log: útil para depurar localmente, ruído (e custo) em produção.
spring.jpa.show-sql=${JPA_SHOW_SQL:false}

# --- CORS: sites que podem chamar a API pelo navegador (separados por vírgula) ---
# Padrão: Live Server local. Em produção, ALLOWED_ORIGINS=https://flow-board-lovat.vercel.app
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

server.port=${PORT:8080}

# --- Contas de usuário (JWT) ---
# Chave que assina os tokens de login. OBRIGATÓRIA (mínimo de 32 bytes): sem ela a aplicação
# não sobe. Vem só da variável de ambiente JWT_SECRET (no Render, e na sua máquina para rodar local).
# Quem tiver essa chave consegue fabricar um token de qualquer usuário: nunca a coloque no código.
app.jwt.secret=${JWT_SECRET:}

# --- IA (Anthropic) ---
# A chave NUNCA fica no código: vem só da variável de ambiente.
# Sem chave, o sistema funciona normalmente usando as regras locais (fallback).
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.timeout=${ANTHROPIC_TIMEOUT:10s}
anthropic.max-tokens=1024
# Sugestões geradas pelo modelo por usuário por dia. Acima disso, usam-se as regras locais.
app.ai.daily-suggestions-per-user=${AI_DAILY_SUGGESTIONS_PER_USER:30}
# Teto do dia somando TODOS os usuários (cada visitante novo ganharia 30; isto limita o total).
app.ai.daily-suggestions-global=${AI_DAILY_SUGGESTIONS_GLOBAL:1000}

# --- Criação de tarefa por linguagem natural (POST /tasks/parse) ---
# Fuso usado para saber que dia é "hoje" (o servidor do Render roda em UTC).
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
# Limite de chamadas por minuto: por cliente (IP) e somando todos os clientes.
app.parse.rate-limit.per-client=${PARSE_RATE_LIMIT_PER_CLIENT:10}
app.parse.rate-limit.global=${PARSE_RATE_LIMIT_GLOBAL:60}