spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/flowboard_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:postgres}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:fei}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=${PORT:8080}

# --- IA (Anthropic) ---
# A chave NUNCA fica no código: vem só da variável de ambiente.
# Sem chave, o sistema funciona normalmente usando as regras locais (fallback).
anthropic.api-key=${ANTHROPIC_API_KEY:}
anthropic.model=${ANTHROPIC_MODEL:claude-haiku-5-5}
anthropic.base-url=${ANTHROPIC_BASE_URL:https://api.anthropic.com}
anthropic.timeout=${ANTHROPIC_TIMEOUT:10s}
anthropic.max-tokens=1024

# --- Criação de tarefa por linguagem natural (POST /tasks/parse) ---
# Fuso usado para saber que dia é "hoje" (o servidor do Render roda em UTC).
app.timezone=${APP_TIMEZONE:America/Sao_Paulo}
# Limite de chamadas por minuto: por cliente (IP) e somando todos os clientes.
app.parse.rate-limit.per-client=${PARSE_RATE_LIMIT_PER_CLIENT:10}
app.parse.rate-limit.global=${PARSE_RATE_LIMIT_GLOBAL:60}